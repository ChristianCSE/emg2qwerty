# @package _global_
module:
  _target_: emg2qwerty.lightning.RNNCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  hidden_size: 384
  num_layers: 3
  rnn_type: lstm
  bidirectional: false
  dropout: 0.0
  trim: 124 # 4 blocks (k_w-1)
  # Total temporal receptive field of 125 samples given 4 layers

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec (of typing) windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
  # new
  test_window_length: null
  test_padding: [0, 0]

# paper tells us how far back a muscle indicates potential keystroke, would furhter
# just be more noise? how does lstm use this any different?