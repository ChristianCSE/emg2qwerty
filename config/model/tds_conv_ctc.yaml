# @package _global_
module:
  _target_: emg2qwerty.lightning.TDSConvCTCModule
  # log_spectogram.logspec..n_fft = 64
  # freq = n_fft / 2 + 1 (/2 because we only have real numbers for voltage, not complex)
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  block_channels: [24, 24, 24, 24]
  kernel_width: 32  # Total temporal receptive field of 125 samples given 4 layers

# window and example are the same thing
# the recorded session is partitioned into 4 second pieces
# each piece (each second) is one example. 32 of them are
# a batch, so a batch is 32 seconds of a recording.
# remember that sample = instance = 0.5 ms
# meaning that has a reading of voltage in the 32 electrodes

# training windows! logspec.__target__ is the real one
# instance = 0.5 ms recording
# this is how we cut the raw data: length 8000 instances
# WindowedEMGDataModule makes stride = w_lenght if not specified
# so slice data into 8000 with stride 8000
datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  # this is used in spectogramNorm, this is time T
  window_length: 8000  # 4 sec (of typing) windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
#  padding: [2000, 400] # further back in time and more into future
